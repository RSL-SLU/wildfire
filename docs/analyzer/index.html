<!doctype html>
<html lang="en">
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: chart-first review board. Hero (world series + three visual tiles), a trend map, then one band per
   paper goal: question, one-line answer with big figures, 1-2 charts, folded statistics. GFED dashboard tokens. */
:root {
  --bg: #f1f1ed; --surface: #ffffff; --ink: #1a1b1c; --ink-2: #4f5357; --muted: #686c71;
  --line: #e4e5e0; --axis: #c8cac4; --accent: #c0461d; --accent-wash: #fbebe3;
  --ocean: #edf2f5; --land: #e6e4de; --land-2: #d6d4cd; --border: #ffffff;
  --div-neg: #1c5cab; --div-neg-2: #86b6ef; --div-mid: #ecebe6; --div-pos-2: #ef9a8e; --div-pos: #b3261e;
  --seq-1: #f7b27a; --seq-2: #e3683a; --seq-3: #b5321e;
  --s-ov: #7a5aa6; --s-nd: #2f7d4f;
  --fx-bo: #2a78d6; --fx-tr: #eb6834; --fx-te: #1baf7a; --fx-df: #eda100;
  --managed: #2f7d4f; --unmanaged: #d9822b; --partial: #9fb3a4; --absent: #c9c8c2;
  --chip: #e8e8e2; --shadow: 0 1px 2px rgba(20,20,20,.06);
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111213; --surface: #1a1b1d; --ink: #eceef0; --ink-2: #b9bdc2; --muted: #858a90; --line: #2a2c30;
  --axis: #3b3f44; --accent: #ec8454; --accent-wash: #3a2318;
  --ocean: #131b22; --land: #27292c; --land-2: #34363a; --border: #121315;
  --div-neg: #5598e7; --div-neg-2: #2c4f7c; --div-mid: #34363a; --div-pos-2: #84403a; --div-pos: #e66767;
  --seq-1: #8a2d16; --seq-2: #d0562a; --seq-3: #f7a35f;
  --s-ov: #9a82cf; --s-nd: #3f9d63;
  --fx-bo: #3987e5; --fx-tr: #d95926; --fx-te: #199e70; --fx-df: #c98500;
  --managed: #3f9d63; --unmanaged: #e0913a; --partial: #4e6355; --absent: #45474b;
  --chip: #26282b; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111213; --surface: #1a1b1d; --ink: #eceef0; --ink-2: #b9bdc2; --muted: #858a90; --line: #2a2c30;
  --axis: #3b3f44; --accent: #ec8454; --accent-wash: #3a2318;
  --ocean: #131b22; --land: #27292c; --land-2: #34363a; --border: #121315;
  --div-neg: #5598e7; --div-neg-2: #2c4f7c; --div-mid: #34363a; --div-pos-2: #84403a; --div-pos: #e66767;
  --seq-1: #8a2d16; --seq-2: #d0562a; --seq-3: #f7a35f;
  --s-ov: #9a82cf; --s-nd: #3f9d63;
  --fx-bo: #3987e5; --fx-tr: #d95926; --fx-te: #199e70; --fx-df: #c98500;
  --managed: #3f9d63; --unmanaged: #e0913a; --partial: #4e6355; --absent: #45474b;
  --chip: #26282b; --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-color: var(--axis) transparent; accent-color: var(--accent); }
::selection { background: var(--accent-wash); color: var(--ink); }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 32px; font-weight: 760; font-stretch: 80%; letter-spacing: -.01em; }
h2 { font-size: 30px; font-weight: 760; font-stretch: 82%; line-height: 1.1; }
h3 { font-size: 16px; font-weight: 650; font-stretch: 90%; color: var(--ink); }
.muted { color: var(--muted); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding-block: 14px 12px; border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
@media (max-width: 640px) { .top { position: static; } } /* three rows of controls: too tall to pin on a phone */
/* site nav, shared by the three pages */
.site { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.site a { font: 600 13px/1 var(--font-body); color: var(--ink-2); text-decoration: none; padding: 0 10px; min-height: 32px; display: inline-flex; align-items: center; border-radius: 6px; }
.site a:hover { color: var(--ink); background: var(--line); }
.site a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
.title { display: grid; gap: 2px; }
.title .site { margin: 0 0 6px -10px; }
.sub { font-size: 13.5px; color: var(--muted); }
.sub a { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; }
.sub a:hover { color: var(--accent); }
.sub a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg button { font: 600 14px var(--font-body); color: var(--ink-2); background: transparent; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
button:focus-visible, summary:focus-visible, th:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

.panel { background: var(--surface); border-radius: var(--r); padding: 14px 16px 12px; min-width: 0; box-shadow: var(--shadow); display: grid; gap: 6px; align-content: start; }
.hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; margin-top: 18px; }
.tiles { display: grid; gap: 12px; }
.tile { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; }
.tile .k { grid-column: 1 / -1; font-size: 14px; color: var(--ink-2); }
.big { font-family: var(--font-display); font-stretch: 75%; font-weight: 760; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.big small { font-size: 19px; font-weight: 650; color: var(--ink-2); margin-left: 2px; }
.tile svg { display: block; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }

.band { margin-top: 30px; display: grid; gap: 14px; }
/* one section per paper goal: a header card with the question and the answer, then its parts */
.goalsec { margin-top: 64px; display: grid; gap: 18px; scroll-margin-top: 150px; }
.ghead { display: grid; gap: 14px; padding: 24px 26px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); border-top: 4px solid var(--accent); }
.ghead .gno { font-family: var(--font-display); font-stretch: 80%; font-weight: 760; font-size: 17px; letter-spacing: .02em; color: var(--accent); }
.ghead .lede { font-size: 18px; color: var(--ink); max-width: 70ch; margin: 0; text-wrap: pretty; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kpi { background: var(--bg); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.kpi .n { font-family: var(--font-display); font-stretch: 75%; font-weight: 760; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .t { font-size: 14.5px; color: var(--ink-2); }
.part { display: grid; gap: 12px; margin-top: 10px; }
.phead { display: grid; gap: 4px; }
.phead h3 { font-size: 22px; font-weight: 720; font-stretch: 85%; }
.phead p { margin: 0; font-size: 15.5px; color: var(--ink-2); max-width: 75ch; text-wrap: pretty; }
.howto .dbody { font-size: 15px; color: var(--ink-2); max-width: 75ch; display: grid; gap: 8px; }
.howto .dbody p { margin: 0; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
.jump a { font: 600 14px/1 var(--font-body); color: var(--ink-2); text-decoration: none; padding: 9px 14px; border-radius: 999px; background: var(--chip); }
.jump a:hover { color: var(--ink); background: var(--line); }
.jump a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.donut { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 26px; }
.chart .donut svg { flex: none; width: 200px; height: 200px; }
.donut ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; flex: 1 1 190px; min-width: 0; }
.donut li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; font-size: 15px; }
.donut li .sw { width: 14px; height: 14px; border-radius: 3px; margin: 0; }
.donut li b { font-family: var(--font-data); font-weight: 500; font-variant-numeric: tabular-nums; }
.donut li small { grid-column: 2 / -1; color: var(--muted); font-size: 13px; }
.kpirow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.kpirow a { color: inherit; text-decoration: none; border-radius: var(--r); display: grid; }
.kpirow a:hover .panel { box-shadow: 0 0 0 1.5px var(--accent); }
.kpirow a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (max-width: 900px) { .kpirow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpirow { grid-template-columns: minmax(0, 1fr); } .ghead { padding: 18px 16px; } h2 { font-size: 25px; } .goalsec { scroll-margin-top: 16px; } }
.bhead { display: grid; gap: 6px; }
.qrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.goal { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-wash); border-radius: 4px; padding: 2px 7px; }
.draft { font-family: var(--font-data); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); border: 1px dashed var(--axis); border-radius: 4px; padding: 1px 7px; }
.answer { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.answer .a { display: inline-flex; align-items: baseline; gap: 8px; font-size: 16px; color: var(--ink-2); }
.answer .n { font-family: var(--font-display); font-stretch: 75%; font-weight: 760; font-size: 44px; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
.bnote { margin: 2px 0 0; font-size: 16px; color: var(--ink-2); max-width: 75ch; text-wrap: pretty; }
.bnote b { color: var(--ink); font-weight: 650; }
.bhead .seg { margin-left: auto; flex-wrap: wrap; border-radius: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.chart { min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; }
.key { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 13px; color: var(--ink-2); }
.key .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

svg text { fill: var(--ink-2); font-family: var(--font-body); font-size: 12.5px; }
svg .ax text { fill: var(--muted); font-family: var(--font-data); font-size: 11.5px; }
svg .ax path, svg .ax line { stroke: var(--axis); }
svg .grid line { stroke: var(--line); }
svg .zero { stroke: var(--axis); }
svg .hit { cursor: pointer; }
svg .lbl { fill: var(--ink); }
svg .lbl.link { cursor: pointer; }
svg .lbl.link:hover { fill: var(--accent); }
svg .country { stroke: var(--border); stroke-width: .5; cursor: pointer; }
svg .country:hover { stroke: var(--ink); stroke-width: 1.2; }

details { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
summary { cursor: pointer; padding: 11px 16px; font-weight: 600; font-size: 14px; color: var(--ink-2); list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; font-family: var(--font-data); display: inline-block; width: 15px; }
details[open] summary::before { content: "\2212"; }
.dbody { padding: 0 16px 14px; }
.tablewrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }
.alpha { display: inline-flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; color: var(--ink-2); }
.alpha input { width: 110px; accent-color: var(--accent); }
.alpha output { font-family: var(--font-data); font-size: 12px; color: var(--ink); min-width: 56px; }
.pick { font: 600 13.5px var(--font-body); color: var(--ink); background: var(--chip); border: 0; border-radius: 999px; padding: 5px 10px; cursor: pointer; }
.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
.search input { font: 13px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; width: min(280px, 100%); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { position: sticky; top: 0; background: var(--surface); font-weight: 600; color: var(--muted); font-size: 12.5px; cursor: pointer; user-select: none; }
td { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
td:first-child { font-family: var(--font-body); }
td .link { color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 2px; }
td .link:hover { color: var(--accent); }
.sig { color: var(--accent); }
.methods { font-size: 15px; color: var(--ink-2); max-width: 82ch; display: grid; gap: 8px; }
.methods p { margin: 0; }

#tip { position: fixed; pointer-events: none; z-index: 30; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; font-size: 13.5px; box-shadow: 0 4px 14px rgba(0,0,0,.14); max-width: 300px; }
#tip .t { font-weight: 650; margin-bottom: 2px; }
#tip .r { font-family: var(--font-data); font-size: 12.5px; color: var(--ink-2); }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100%); background: var(--surface); z-index: 20;
  border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.14); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) 18px;
  display: grid; gap: 14px; align-content: start; }
.dhead { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.close { font: 600 13px var(--font-body); background: var(--chip); color: var(--ink); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.dstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dstats div { background: var(--bg); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.dstats .k { font-size: 11px; color: var(--muted); }
.dstats .v { font-family: var(--font-display); font-stretch: 80%; font-weight: 720; font-size: 20px; font-variant-numeric: tabular-nums; }
.chipx { font-size: 11.5px; background: var(--chip); border-radius: 999px; padding: 2px 9px; color: var(--ink-2); justify-self: start; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 14px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.loading { padding: 40px 0; color: var(--muted); }
.fxbar { display: flex; gap: 2px; height: 12px; border-radius: 3px; overflow: hidden; }
.fxbar span { display: block; min-width: 2px; }
</style>

<div class="wrap">
  <header class="top">
    <div class="title">
      <nav class="site" aria-label="Site"><a href="https://rsl-slu.github.io/wildfire/">Dashboard</a><a href="https://rsl-slu.github.io/wildfire/explore.html">Explorer</a><a href="https://rsl-slu.github.io/wildfire/analyzer/" aria-current="page">Country analyzer</a></nav>
      <h1>Forest fire trends by country</h1>
      <div class="sub">Policy paper review · GFED5.1</div>
    </div>
    <div class="ctls" role="toolbar" aria-label="Analysis settings">
      <div class="seg" id="ser">
        <button type="button" id="ser-nd" data-v="nd" aria-pressed="true"><span class="dot" style="background:var(--s-nd)"></span>Without deforestation</button>
        <button type="button" id="ser-ov" data-v="ov" aria-pressed="false"><span class="dot" style="background:var(--s-ov)"></span>Forest overall</button>
      </div>
      <div class="seg" id="per">
        <button type="button" id="per-2025" data-v="2025" aria-pressed="true">2002–2025</button>
        <button type="button" id="per-2022" data-v="2022" aria-pressed="false">2002–2022</button>
      </div>
      <label class="alpha" for="alpha"><span>Significance</span>
        <input type="range" id="alpha" min="0.01" max="0.2" step="0.01" value="0.05">

    </div>
    <nav class="jump" aria-label="Sections"><a href="#overview">Overview</a><a href="#map">Map</a><a href="#goal1">Goal 1 · Rising?</a><a href="#goal2">Goal 2 · Drivers</a><a href="#goal3">Goal 3 · Unmanaged land</a><a href="#methods">Methods</a></nav>

</div>

<script>
"use strict";
const SHORT = { "Democratic Republic of the Congo": "DR Congo", "United States of America": "United States",
  "Central African Republic": "Central African Rep.", "Republic of the Congo": "Rep. Congo",
  "United Republic of Tanzania": "Tanzania", "Bosnia and Herzegovina": "Bosnia & Herz." };
const short = n => SHORT[n] || n;
const SER_NAME = { nd: "without deforestation", ov: "forest overall" };
const ST = {
  unmanaged: { label: "Reports unmanaged forest", color: "var(--unmanaged)" },
  managed: { label: "All forest managed", color: "var(--managed)" },
  partial: { label: "Unmanaged not reported", color: "var(--partial)" },
  nodata: { label: "No usable UNFCCC number", color: "var(--absent)" },
  absent: { label: "Not in UNFCCC table", color: "var(--absent)" },
};
const MIN_MEAN = 1.0;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let DUR = RM ? 0 : 650;
const state = { ser: "nd", per: 2025, top1: 20, top2: 10, top3: 10, layer: "trend", alpha: 0.05 };
const FX = [{ k: "bo", label: "Boreal forest", c: "var(--fx-bo)" }, { k: "tr", label: "Tropical forest", c: "var(--fx-tr)" },
  { k: "te", label: "Temperate forest", c: "var(--fx-te)" }, { k: "df", label: "Deforestation", c: "var(--fx-df)" }];
const NRT0 = 2023; // first year from GFED5.1 NRT (VIIRS); earlier years are GFED5.1
function pickHtml(id, val, n) {
  return `<select class="pick" id="${id}" aria-label="How many countries">${[[10, "Top 10"], [20, "Top 20"], [0, `All (${n})`]]
    .map(([v, t]) => `<option value="${v}"${v === val ? " selected" : ""}>${t}</option>`).join("")}</select>`;
}
function bindPick(scope, id, key, redraw) {
  scope.querySelector(`#${id}`).addEventListener("change", e => { state[key] = +e.target.value; redraw(); });
}
let D, GEO, R;

// ---------- statistics (same method as the dashboard and 07_meeting_figures.py) ----------
function median(a) { const s = Float64Array.from(a).sort(); const n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; }
function theilSen(x, y) {
  const sl = [];
  for (let i = 0; i < x.length; i++) for (let j = i + 1; j < x.length; j++) sl.push((y[j] - y[i]) / (x[j] - x[i]));
  const slope = median(sl);

// ---------- compute everything for the current switches ----------
function compute() {
  const k = D.years.indexOf(state.per) + 1, yrs = D.years.slice(0, k), o = state.ser === "nd" ? "ov" : "nd";
  const h = Math.floor(k / 2), y1s = yrs.slice(0, h), y2s = yrs.slice(h); // first and second half of the period
  const boot = D.boot[state.ser + state.per];
  const rows = D.countries.map(c => {
    const y = c[state.ser].slice(0, k), t = trend(yrs, y), to = trend(yrs, c[o].slice(0, k));
    const ovSum = d3.sum(c.ov.slice(0, k)), ndSum = d3.sum(c.nd.slice(0, k));
    const m1 = mean(y.slice(0, h)), m2 = mean(y.slice(h));
    const fx = {}, fx_abs = {}; FX.forEach(f => { fx_abs[f.k] = c.fx[f.k].slice(0, k); fx[f.k] = ovSum > 0 ? d3.sum(fx_abs[f.k]) / ovSum : 0; });
    // map colour: the largest of the three forest classes (three hues stay apart for colour-blind readers on a map)
    const dom = ovSum > 0 ? FX.slice(0, 3).reduce((a, f) => fx[f.k] > fx[a.k] ? f : a) : null;
    const bt = boot.c[c.iso] || [0, 0];
    return { ...c, y, t, to, reliable: ovSum / k >= MIN_MEAN, deforShare: ovSum > 0 ? 1 - ndSum / ovSum : 0,
      unmanShare: c.man != null && c.unman != null && c.man + c.unman > 0 ? c.unman / (c.man + c.unman) : null,
      m1, m2, d: m2 - m1, rch: m1 > 0 ? 100 * (m2 / m1 - 1) : NaN, t1: trend(y1s, y.slice(0, h)), t2: trend(y2s, y.slice(h)),
      fx, fx_abs, dom, f50: bt[0], f90: bt[1] };
  });
  const byIso = new Map(rows.map(r => [r.iso, r]));
  const wy = D.world[state.ser].slice(0, k), world = { y: wy, other: D.world[o].slice(0, k), t: trend(yrs, wy), m1: mean(wy.slice(0, h)), m2: mean(wy.slice(h)) };
  const rising = rows.filter(r => r.t.slope > 0).sort((a, b) => b.t.slope - a.t.slope);
  const rv = rising.map(r => r.t.slope), totRise = d3.sum(rv), fall = d3.sum(rows.filter(r => r.t.slope < 0), r => r.t.slope);
  let c = 0; rising.forEach(r => { c += r.t.slope; r.cum = c / totRise; });
  const n = { 50: nFor(rv, .5), 75: nFor(rv, .75), 90: nFor(rv, .9) };
  // halves: who holds the increase between the first and the second half
  const inc = rows.filter(r => r.d > 0).sort((a, b) => b.d - a.d), iv = inc.map(r => r.d), totInc = d3.sum(iv);
  c = 0; inc.forEach(r => { c += r.d; r.icum = c / totInc; });
  const nInc = { 50: nFor(iv, .5), 75: nFor(iv, .75), 90: nFor(iv, .9) };
  const annual = yrs.map((yr, i) => {
    const ex = rows.map(r => ({ r, e: Math.max(0, r.y[i] - r.t.mean) })).filter(d => d.e > 0).sort((a, b) => b.e - a.e);
    const ev = ex.map(d => d.e);
    return { yr, tot: d3.sum(ev), n50: ev.length ? nFor(ev, .5) : 0, n75: ev.length ? nFor(ev, .75) : 0, n90: ev.length ? nFor(ev, .9) : 0, top: ex.slice(0, 3).map(d => d.r) };
  });
  const byStatus = {}; Object.keys(ST).forEach(s => byStatus[s] = 0);
  rising.forEach(r => byStatus[r.st] += r.t.slope);

  return { k, yrs, h, y1s, y2s, boot, rows, byIso, world, rising, totRise, fall, n, inc, totInc, nInc, annual, byStatus, rel,
    up: rel.filter(r => r.t.sig && r.t.pct > 0), down: rel.filter(r => r.t.sig && r.t.pct < 0) };
}

function drawDonut(node, parts, [big, small]) {
  const tot = d3.sum(parts, p => p.v), S = 200, r = S / 2;
  const wrap = el("div", { class: "donut" }); node.append(wrap);
  const svg = d3.select(wrap).append("svg").attr("viewBox", `0 0 ${S} ${S}`).attr("role", "img")
    .attr("aria-label", parts.map(p => `${p.label} ${fmt(100 * p.v / tot, 0)}%`).join(", "));
  const g = svg.append("g").attr("transform", `translate(${r},${r})`);
  const arc = d3.arc().innerRadius(r * .62).outerRadius(r - 2).cornerRadius(3);
  g.selectAll("path").data(d3.pie().sort(null).value(p => p.v)(parts)).join("path")
    .attr("fill", d => d.data.c).attr("stroke", "var(--surface)").attr("stroke-width", 2).attr("class", d => d.data.iso ? "hit" : null)
    .on("mousemove", (ev, d) => showTip(ev, `<div class="t">${d.data.label}</div><div class="r">${fmt(100 * d.data.v / tot, 1)}%</div>${d.data.sub ? `<div class="r">${d.data.sub}</div>` : ""}`))
    .on("mouseleave", hideTip).on("click", (ev, d) => d.data.iso && openCountry(d.data.iso))
    .attr("d", d => arc({ ...d, endAngle: d.startAngle }))
    .transition().duration(DUR).ease(d3.easeCubicOut).attrTween("d", d => { const i = d3.interpolate(d.startAngle, d.endAngle); return t => arc({ ...d, endAngle: i(t) }); });
  g.append("text").attr("text-anchor", "middle").attr("y", 4).style("fill", "var(--ink)").style("font-family", "var(--font-display)").style("font-stretch", "75%")
    .attr("font-weight", 760).style("font-size", "40px").text(big);
  g.append("text").attr("text-anchor", "middle").attr("y", 26).style("fill", "var(--ink-2)").style("font-size", "12.5px").text(small);
  const ul = el("ul"); wrap.append(ul);
  parts.forEach(p => ul.insertAdjacentHTML("beforeend", `<li><span class="sw" style="background:${p.c}"></span><span>${p.label}</span><b>${fmt(100 * p.v / tot, 0)}%</b>${p.sub ? `<small>${p.sub}</small>` : ""}</li>`));
}

function tableDetails(title, rows, cols, sortCol) {
  const id = "q-" + title.toLowerCase().replace(/[^a-z]+/g, "-");
  const d = el("details"); d.innerHTML = `<summary>${title} (${rows.length})</summary><div class="dbody">
    <div class="search"><input type="search" id="${id}" placeholder="Search" aria-label="Search ${title}"><span class="muted" id="${id}-n"></span></div>
    <div class="tablewrap"></div></div>`;
  let sc = sortCol, sd = true, q = ""; const wrap = d.querySelector(".tablewrap"), box = d.querySelector("input"), cnt = d.querySelector(`#${id}-n`);
  box.addEventListener("input", () => { q = box.value.trim().toLowerCase(); draw(); });
  const text = r => cols.filter(c => c[2] === "s").map(c => String(c[1](r) ?? "")).join(" ").toLowerCase() + " " + (r.iso || "").toLowerCase();
  function draw() {
    const base = q ? rows.filter(r => text(r).includes(q)) : rows;
    cnt.textContent = q ? `${base.length} of ${rows.length}` : "";
    const data = sc < 0 ? base.slice() : base.slice().sort((a, b) => {
      const va = cols[sc][1](a), vb = cols[sc][1](b);
      const bad = v => v == null || (typeof v === "number" && !isFinite(v)); if (bad(va)) return 1; if (bad(vb)) return -1;
      return (typeof va === "string" ? va.localeCompare(vb) : va - vb) * (sd ? -1 : 1); });
    const t = el("table");
    t.innerHTML = `<thead><tr>${cols.map((c, i) => `<th tabindex="0" data-i="${i}" aria-sort="${i === sc ? (sd ? "descending" : "ascending") : "none"}">${c[0]}${i === sc ? (sd ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead>`;
    const tb = el("tbody");
    data.forEach(r => { const tr = el("tr");
      tr.innerHTML = cols.map((c, i) => { const v = c[1](r);
        if (i === 0 && r.iso) return `<td><span class="link" data-iso="${r.iso}">${v}</span></td>`;
        if (c[2] === "s") return `<td style="${i ? "font-family:var(--font-body)" : ""}">${v ?? ""}</td>`;
        if (c[2] === "p") return `<td class="${v < state.alpha ? "sig" : ""}">${pfmt(v)}</td>`;
        return `<td>${v == null ? "–" : fmt(v, c[2])}</td>`; }).join("");
      tb.append(tr); });
    t.append(tb); wrap.innerHTML = ""; wrap.append(t);
    t.querySelectorAll("th").forEach(th => { const go = () => { const i = +th.dataset.i; if (i === sc) sd = !sd; else { sc = i; sd = true; } draw(); };
      th.addEventListener("click", go); th.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } }); });
    t.querySelectorAll(".link").forEach(a => a.addEventListener("click", () => openCountry(a.dataset.iso)));
  }
  draw(); return d;
}

function drawMap(node, keyNode, titleNode) {
  const W = 960, H = 440, L = state.layer;
  const frame = []; for (let lo = -150; lo <= 172; lo += 2) frame.push([lo, -58], [lo, 84], [lo, 0]); for (let la = -58; la <= 84; la += 2) frame.push([-150, la], [172, la]);
  const proj = d3.geoRobinson().rotate([-11, 0]).fitExtent([[4, 4], [W - 4, H - 4]], { type: "MultiPoint", coordinates: frame });
  const path = d3.geoPath(proj), div = divColor();
  const st = [cssVar("--div-neg"), cssVar("--div-neg-2"), cssVar("--div-mid"), cssVar("--div-pos-2"), cssVar("--div-pos")];
  const chg = d3.scaleLinear().domain([-1, -.4, 0, .4, 1]).range(st).interpolate(d3.interpolateRgb).clamp(true);
  const seq = d3.scaleLinear().domain([0, .5, 1]).range([cssVar("--seq-1"), cssVar("--seq-2"), cssVar("--seq-3")]).interpolate(d3.interpolateRgb).clamp(true);
  const fill = r => {
    if (L === "unfccc") return ST[r.st].color;
    if (L === "type") return r.dom && r.t.mean >= 0.1 ? r.dom.c : "var(--land-2)";
    if (L === "sure") return r.f90 > 0 ? seq(r.f90) : "var(--land-2)";
    if (!r.reliable) return "var(--land-2)";
    if (L === "change") return r.m1 > 0 && r.m2 > 0 ? chg(Math.log2(r.m2 / r.m1)) : "var(--land-2)";
    return isFinite(r.t.pct) ? div(r.t.pct) : "var(--land-2)";
  };

// ---------- Goal 3 ----------
function drawScatter(node) {
  const data = R.rows.filter(r => r.unmanShare != null && r.t.mean >= 0.1 && isFinite(r.t.pct));
  const W = chartW(node, 520), H = 290, m = { t: 12, r: 18, b: 36, l: 50 }, placed = [];
  const x = d3.scaleLinear().domain([0, Math.max(0.5, d3.max(data, r => r.unmanShare))]).nice().range([m.l, W - m.r]);
  const ext = d3.max(data, r => Math.abs(r.t.pct)) || 1, y = d3.scaleLinear().domain([-ext, ext]).nice().range([H - m.b, m.t]);
  const rr = d3.scaleSqrt().domain([0, d3.max(data, r => r.t.mean)]).range([3, 22]);
  const s = svgIn(node, W, H);
  s.append("g").attr("class", "grid").selectAll("line").data(y.ticks(6)).join("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", d => y(d)).attr("y2", d => y(d));
  s.append("line").attr("class", "zero").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(0)).attr("y2", y(0)).attr("stroke-width", 1.2);
  s.append("g").attr("class", "ax").attr("transform", `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(5).tickFormat(d3.format(".0%")).tickSizeOuter(0));
  s.append("g").attr("class", "ax").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(6).tickFormat(d => sgn(d, 0) + "%").tickSizeOuter(0));
  s.append("text").attr("x", (m.l + W - m.r) / 2).attr("y", H - 3).attr("text-anchor", "middle").style("fill", "var(--muted)").style("font-size", "12px").text("Unmanaged share of reported forest land");
  s.append("text").attr("transform", `translate(12,${(m.t + H - m.b) / 2}) rotate(-90)`).attr("text-anchor", "middle").style("fill", "var(--muted)").style("font-size", "12px").text("Trend, %/yr");
  data.sort((a, b) => b.t.mean - a.t.mean).forEach((r, i) => {
    const c = r.unmanShare > 0 ? "var(--unmanaged)" : "var(--managed)";
    s.append("circle").attr("class", "hit").attr("cx", x(r.unmanShare)).attr("cy", y(r.t.pct)).attr("r", 0)
      .attr("fill", c).attr("fill-opacity", .5).attr("stroke", c).attr("stroke-width", r.t.sig ? 2 : .8)

      .transition().duration(DUR).delay(RM ? 0 : i * 15).attr("r", rr(r.t.mean));
    if (r.unmanShare > 0 || r.t.mean > 8) { // largest first, so a smaller neighbour's label gives way
      const cx = x(r.unmanShare), rad = rr(r.t.mean), right = cx > W - m.r - 80;
      keepIfClear(s.append("text").attr("x", right ? cx - rad - 3 : cx + rad + 3).attr("y", y(r.t.pct)).attr("dy", "0.32em").attr("text-anchor", right ? "end" : "start")
        .style("font-size", "12px").style("fill", "var(--ink)").text(short(r.name)), placed);
    }
  });
}

// ---------- country drawer ----------
const drawer = document.getElementById("drawer");
let lastFocus = null;
function closeDrawer() {
  if (drawer.hidden) return;
  drawer.hidden = true; delete drawer.dataset.iso;
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}
// re-render keeps the open drawer and any expanded statistics panels
function rerender(animate = true) {
  const open = drawer.hidden ? null : drawer.dataset.iso;
  const expanded = [...document.querySelectorAll("#app details")].map(d => d.open);
  const keep = DUR; if (!animate) DUR = 0;
  render();
  document.querySelectorAll("#app details").forEach((d, i) => { if (expanded[i]) d.open = true; });
  if (open) openCountry(open, false);
  DUR = keep;
}

  s.append("g").attr("class", "ax").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(4).tickSizeOuter(0));
  s.append("g").selectAll("rect").data(r.y).join("rect").attr("x", (v, i) => x(yrs[i])).attr("width", x.bandwidth()).attr("rx", 1.5).attr("fill", serColor(state.ser))

  s.append("path").datum(other).attr("fill", "none").attr("stroke", "var(--muted)").attr("stroke-width", 1.5).attr("d", d3.line().x((v, i) => x(yrs[i]) + x.bandwidth() / 2).y(v => y(v)));

// ---------- controls ----------
function bindSeg(id, key, cast) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener("click", () => {
    state[key] = cast(b.dataset.v);
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    rerender();
  }));
}
bindSeg("ser", "ser", String); bindSeg("per", "per", Number);
{ // charts are drawn at the container width, so redraw (without animation) when that width changes
  let lastW = 0, tmr;
  new ResizeObserver(([e]) => {
    const w = Math.round(e.contentRect.width); if (!D || Math.abs(w - lastW) < 8) return;
    const first = !lastW; lastW = w; if (first) return;
    clearTimeout(tmr); tmr = setTimeout(() => rerender(false), 150);
  }).observe(document.getElementById("app"));
}
{ // significance slider: label follows the thumb, charts redraw (without animation) once it settles
  const a = document.getElementById("alpha"), out = document.getElementById("alpha-v"); let tmr;

}
